<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokenof — Token 用量儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: {} } }
</script>
<style>
  :root {
    --bg: #f8fafc; --bg-card: #ffffff; --border: #e2e8f0;
    --text: #1e293b; --text-muted: #64748b; --text-sub: #94a3b8;
    --accent: #3b82f6; --accent2: #8b5cf6; --danger: #ef4444;
    --success: #22c55e; --warning: #f59e0b; --grid: rgba(0,0,0,0.04);
  }
  .dark {
    --bg: #0f172a; --bg-card: #1e293b; --border: #334155;
    --text: #f1f5f9; --text-muted: #94a3b8; --text-sub: #64748b;
    --grid: rgba(255,255,255,0.04);
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .stat-value { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
  .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); cursor: pointer; font-size: 0.8rem; transition: all 0.15s; }
  .btn:hover { color: var(--text); border-color: var(--text-muted); }
  .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .view-btn, .src-btn { padding: 5px 12px; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.78rem; font-weight: 500; transition: all 0.15s; }
  .view-btn:hover, .src-btn:hover { color: var(--text); }
  .view-btn.active, .src-btn.active { background: var(--accent); color: #fff; }
  .insight-good { border-left: 3px solid var(--success); }
  .insight-warn { border-left: 3px solid var(--warning); }
  .insight-bad { border-left: 3px solid var(--danger); }
  .trend-up { color: var(--danger); }
  .trend-down { color: var(--success); }
  .trend-flat { color: var(--text-muted); }
  .chart-container { position: relative; width: 100%; height: 320px; }
</style>
</head>
<body class="min-h-screen p-4 md:p-6">

<div class="max-w-7xl mx-auto">
  <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">🔭 Tokenof</h1>
      <p class="text-sm text-[var(--text-muted)] mt-0.5">Token 用量儀表板</p>
    </div>
    <div class="flex items-center gap-3 flex-wrap">
      <span id="fetchedAt" class="text-xs text-[var(--text-sub)]"></span>
      <div class="flex rounded-lg border border-[var(--border)] overflow-hidden">
        <button class="view-btn active" data-view="year"  onclick="switchView('year')">年</button>
        <button class="view-btn"        data-view="month" onclick="switchView('month')">月</button>
        <button class="view-btn"        data-view="day"   onclick="switchView('day')">日</button>
      </div>
      <button class="btn" onclick="toggleTheme()" title="切換主題">🌓</button>
    </div>
  </div>

  <!-- Source filter -->
  <div class="flex gap-2 mb-4 flex-wrap" id="sourceFilter">
    <button class="src-btn active" data-src="all" onclick="switchSource('all')">全部</button>
    <button class="src-btn" data-src="deepseek" onclick="switchSource('deepseek')">DeepSeek</button>
    <button class="src-btn" data-src="claude-code" onclick="switchSource('claude-code')">Claude Code</button>
    <button class="src-btn" data-src="codex" onclick="switchSource('codex')">Codex</button>
  </div>

  <!-- Codex quota card -->
  <div class="card mb-4" id="codexQuota" style="display:none"></div>

  <!-- Summary Cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6" id="summaryCards"></div>

  <!-- Month-over-Month Comparison -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6" id="momCards"></div>

  <!-- Charts Row 1 -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
    <div class="card">
      <h3 class="text-sm font-semibold mb-3 text-[var(--text-muted)] uppercase tracking-wide" id="chart1Title">用量趨勢</h3>
      <div class="chart-container"><canvas id="chartMonthly"></canvas></div>
    </div>
    <div class="card">
      <h3 class="text-sm font-semibold mb-3 text-[var(--text-muted)] uppercase tracking-wide" id="chart2Title">用量明細</h3>
      <div class="chart-container"><canvas id="chartDaily"></canvas></div>
    </div>
  </div>

  <!-- Charts Row 2 -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
    <div class="card">
      <h3 class="text-sm font-semibold mb-3 text-[var(--text-muted)] uppercase tracking-wide">模型用量分布</h3>
      <div class="flex flex-col md:flex-row gap-4">
        <div class="flex-1 chart-container" style="max-height:250px"><canvas id="chartModelTokens"></canvas></div>
        <div class="flex-1 chart-container" style="max-height:250px"><canvas id="chartModelCost"></canvas></div>
      </div>
    </div>
    <div class="card">
      <h3 class="text-sm font-semibold mb-3 text-[var(--text-muted)] uppercase tracking-wide">Cache 命中率趨勢</h3>
      <div class="chart-container"><canvas id="chartCacheRate"></canvas></div>
    </div>
  </div>

  <!-- Insights -->
  <div class="card mb-6">
    <h3 class="text-sm font-semibold mb-3 text-[var(--text-muted)] uppercase tracking-wide">💡 Token 優化洞察</h3>
    <div id="insightsContainer" class="space-y-2"></div>
  </div>

  <!-- Model Detail Table -->
  <div class="card">
    <h3 class="text-sm font-semibold mb-3 text-[var(--text-muted)] uppercase tracking-wide">模型用量明細</h3>
    <div class="overflow-x-auto">
      <table class="w-full text-sm" id="modelTable">
        <thead>
          <tr class="text-left text-xs text-[var(--text-sub)] uppercase tracking-wide">
            <th class="pb-2">來源</th><th class="pb-2">模型</th>
            <th class="pb-2 text-right">Cache Hit</th><th class="pb-2 text-right">Cache Miss</th>
            <th class="pb-2 text-right">Response</th><th class="pb-2 text-right">總 Token</th>
            <th class="pb-2 text-right">請求數</th><th class="pb-2 text-right">花費</th><th class="pb-2 text-right">命中率</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let rawData = null;
let currentView = 'year';
let currentSource = 'all';
let charts = {};

const SOURCE_LABEL = { 'deepseek': 'DeepSeek', 'claude-code': 'Claude Code', 'codex': 'Codex' };
const SOURCE_COLOR = { 'deepseek': '#3b82f6', 'claude-code': '#8b5cf6', 'codex': '#22c55e' };

// ============================================================
// FORMAT
// ============================================================
function fmtUnit(n) {
  if (n == null || isNaN(n) || n === 0) return '0';
  const abs = Math.abs(n);
  if (abs < 10000) return n.toLocaleString();
  if (abs < 1e6) return (n / 1e4).toFixed(2) + ' 萬';
  return (n / 1e8).toFixed(2) + ' 億';
}
function fmtCny(n) { return '¥' + (n || 0).toFixed(2); }
function fmtPct(n) { return (n * 100).toFixed(1) + '%'; }
function fmtInt(n) { return (n || 0).toLocaleString(); }

// ============================================================
// THEME
// ============================================================
function toggleTheme() {
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('tokenof-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  updateChartThemes();
}
function updateChartThemes() {
  const isDark = document.documentElement.classList.contains('dark');
  const gridColor = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
  const tickColor = isDark ? '#94a3b8' : '#64748b';
  Object.values(charts).forEach(c => {
    if (c.options.scales?.x?.ticks) c.options.scales.x.ticks.color = tickColor;
    if (c.options.scales?.y?.ticks) { c.options.scales.y.ticks.color = tickColor; c.options.scales.y.grid.color = gridColor; }
    if (c.options.plugins?.legend?.labels) c.options.plugins.legend.labels.color = tickColor;
    c.update();
  });
}

// ============================================================
// DATA HELPERS (schema v2: daily[] has `source`)
// ============================================================
function getDaily() {
  if (!rawData || !rawData.daily) return [];
  if (currentSource === 'all') return rawData.daily;
  return rawData.daily.filter(d => d.source === currentSource);
}

function getDaysInView(daily) {
  if (!daily.length) return [];
  const now = new Date(); now.setHours(0,0,0,0);
  if (currentView === 'year') {
    const cutoff = new Date(now); cutoff.setFullYear(cutoff.getFullYear() - 1);
    return daily.filter(d => new Date(d.date + 'T00:00:00') >= cutoff);
  } else if (currentView === 'month') {
    const cutoff = new Date(now); cutoff.setMonth(cutoff.getMonth() - 1);
    return daily.filter(d => new Date(d.date + 'T00:00:00') >= cutoff);
  } else {
    return daily.slice(-31);
  }
}

function groupBy(days, key) {
  const map = {};
  days.forEach(d => {
    const k = d[key];
    if (!map[k]) map[k] = { hit: 0, miss: 0, resp: 0, tokens: 0, cost: 0, reqs: 0 };
    map[k].hit += d.prompt_cache_hit || d.total_hit || 0;
    map[k].miss += d.prompt_cache_miss || d.total_miss || 0;
    map[k].resp += d.response || d.total_resp || 0;
    map[k].tokens += d.total_tokens || 0;
    map[k].reqs += d.request_count || 0;
  });
  // cost summed separately below
  return map;
}

// For each daily record, compute per-record cost (metered CNY only)
function recordCost(d) {
  let c = 0;
  if (d.models) {
    Object.values(d.models).forEach(m => {
      if (m.cost && m.cost_basis === 'metered') c += m.cost;
    });
  }
  return c;
}

function getGroupedByMonth(days) {
  const map = {};
  days.forEach(d => {
    const m = d.date.substring(0, 7);
    if (!map[m]) map[m] = { tokens: 0, cost: 0, hit: 0, miss: 0, resp: 0, reqs: 0 };
    map[m].tokens += d.total_tokens;
    map[m].cost += recordCost(d);
    map[m].hit += d.prompt_cache_hit; map[m].miss += d.prompt_cache_miss;
    map[m].resp += d.response; map[m].reqs += d.request_count;
  });
  return Object.entries(map).map(([m, v]) => ({ month: m, ...v }));
}

function getGroupedByWeek(days) {
  const map = {};
  days.forEach(d => {
    const dt = new Date(d.date + 'T00:00:00');
    const day = dt.getDay();
    const monday = new Date(dt); monday.setDate(dt.getDate() - (day === 0 ? 6 : day - 1));
    const wk = monday.toISOString().substring(0, 10);
    if (!map[wk]) map[wk] = { tokens: 0, cost: 0, hit: 0, miss: 0, resp: 0, reqs: 0 };
    map[wk].tokens += d.total_tokens; map[wk].cost += recordCost(d);
    map[wk].hit += d.prompt_cache_hit; map[wk].miss += d.prompt_cache_miss;
    map[wk].resp += d.response; map[wk].reqs += d.request_count;
  });
  return Object.entries(map).map(([wk, v]) => ({ week: wk, ...v }));
}

function getGroupedByDay(days) {
  return days.map(d => ({
    date: d.date, label: d.date.substring(5),
    hit: d.prompt_cache_hit, miss: d.prompt_cache_miss, resp: d.response,
    tokens: d.total_tokens, cost: recordCost(d),
    cacheRate: d.cache_hit_rate, reqs: d.request_count,
  }));
}

function getModelAgg(days) {
  const map = {};
  days.forEach(d => {
    Object.entries(d.models || {}).forEach(([name, m]) => {
      const key = d.source + '::' + name;
      if (!map[key]) map[key] = { source: d.source, name, hit: 0, miss: 0, resp: 0, tokens: 0, cost: 0, reqs: 0 };
      map[key].hit += m.prompt_cache_hit; map[key].miss += m.prompt_cache_miss;
      map[key].resp += m.response; map[key].tokens += m.prompt_cache_hit + m.prompt_cache_miss + m.response;
      map[key].cost += (m.cost && m.cost_basis === 'metered') ? m.cost : 0;
      map[key].reqs += m.request_count;
    });
  });
  return Object.values(map);
}

function getSummary(days) {
  const totalTokens = days.reduce((s, d) => s + d.total_tokens, 0);
  const totalCost = days.reduce((s, d) => s + recordCost(d), 0);
  const totalHit = days.reduce((s, d) => s + d.prompt_cache_hit, 0);
  const totalMiss = days.reduce((s, d) => s + d.prompt_cache_miss, 0);
  const totalReqs = days.reduce((s, d) => s + d.request_count, 0);
  return {
    totalTokens, totalCost,
    cacheRate: (totalHit + totalMiss) > 0 ? totalHit / (totalHit + totalMiss) : 0,
    totalReqs, avgTokensPerReq: totalReqs > 0 ? Math.round(totalTokens / totalReqs) : 0,
    totalHit, totalMiss,
  };
}

const VIEW_PLAN = {
  year:  { left: 'month', right: 'month', leftTitle: '每月用量趨勢 (近一年)', rightTitle: '每月用量明細 (近一年)' },
  month: { left: 'week',  right: 'day',   leftTitle: '每週用量趨勢 (近一月)', rightTitle: '每日用量明細 (近一月)' },
  day:   { left: 'day',   right: 'day',   leftTitle: '每日用量趨勢 (近31天)', rightTitle: '每日用量明細 (近31天)' },
};
function getSeries(days, g) { return g === 'month' ? getGroupedByMonth(days) : g === 'week' ? getGroupedByWeek(days) : getGroupedByDay(days); }

// ============================================================
// RENDER
// ============================================================
function renderAll() {
  const daily = getDaily();
  if (!rawData || !daily.length) {
    document.body.innerHTML = '<div class="flex items-center justify-center min-h-screen text-[var(--text-muted)]">[INFO] 尚無資料 — 請先執行 build.py</div>';
    return;
  }
  document.getElementById('fetchedAt').textContent = '更新: ' + (rawData.fetched_at || '') + (rawData.is_mock ? ' (MOCK)' : '');

  renderCodexQuota();
  const plan = VIEW_PLAN[currentView];
  const viewDays = getDaysInView(daily);
  const leftSeries = getSeries(viewDays, plan.left);
  const rightSeries = getSeries(viewDays, plan.right);
  const summary = getSummary(viewDays);
  const modelAgg = getModelAgg(viewDays);
  const allMonths = getGroupedByMonth(daily);

  document.getElementById('chart1Title').textContent = plan.leftTitle;
  document.getElementById('chart2Title').textContent = plan.rightTitle;

  renderSummaryCards(summary);
  renderMoMCards(allMonths);
  renderTrendChart(leftSeries, plan.left);
  renderBreakdownChart(rightSeries, plan.right);
  renderModelCharts(modelAgg);
  renderCacheRateChart(getGroupedByDay(viewDays));
  renderInsights(summary, getGroupedByDay(viewDays), modelAgg);
  renderModelTable(modelAgg);
  updateChartThemes();
}

function renderCodexQuota() {
  const el = document.getElementById('codexQuota');
  const rl = rawData.codex_rate_limits;
  if (!rl || !Object.keys(rl).length || (currentSource !== 'all' && currentSource !== 'codex')) {
    el.style.display = 'none'; return;
  }
  el.style.display = 'block';
  const used = rl.used_percent != null ? rl.used_percent.toFixed(1) : '—';
  const resetDate = rl.resets_at ? new Date(rl.resets_at * 1000).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }) : '—';
  el.innerHTML = '<div class="flex items-center gap-4 flex-wrap"><div class="stat-label">Codex 額度 (Plus)</div><div class="stat-value" style="font-size:1.4rem;color:var(--accent2)">' + used + '%</div><div class="text-sm text-[var(--text-muted)]">已用額度 · 重置於 ' + resetDate + '</div></div>';
}

function renderSummaryCards(summary) {
  const costLabel = currentSource === 'deepseek' || currentSource === 'all' ? '實際花費 (CNY)' : '花費';
  document.getElementById('summaryCards').innerHTML =
    '<div class="card"><div class="stat-label">總 Token</div><div class="stat-value">' + fmtUnit(summary.totalTokens) + '</div></div>' +
    '<div class="card"><div class="stat-label">' + costLabel + '</div><div class="stat-value" style="color:var(--danger)">' + fmtCny(summary.totalCost) + '</div><div class="text-xs text-[var(--text-sub)]">' + (currentSource === 'all' ? '僅 DeepSeek 實際計費' : '') + '</div></div>' +
    '<div class="card"><div class="stat-label">Cache 命中率</div><div class="stat-value" style="color:' + (summary.cacheRate >= 0.9 ? 'var(--success)' : summary.cacheRate >= 0.8 ? 'var(--warning)' : 'var(--danger)') + '">' + fmtPct(summary.cacheRate) + '</div></div>' +
    '<div class="card"><div class="stat-label">API 請求數</div><div class="stat-value">' + fmtInt(summary.totalReqs) + '</div><div class="text-xs text-[var(--text-sub)] mt-0.5">平均 ' + fmtInt(summary.avgTokensPerReq) + ' tokens/req</div></div>';
}

function renderMoMCards(allMonths) {
  if (allMonths.length < 2) return;
  const thisMonth = allMonths[allMonths.length - 1];
  const lastMonth = allMonths[allMonths.length - 2];
  const allDaily = getDaily();
  const mtdDays = allDaily.filter(d => d.date.substring(0,7) === thisMonth.month).length;
  const lastMtd = allDaily.filter(d => d.date.substring(0,7) === lastMonth.month).slice(0, mtdDays);
  const thisMtd = allDaily.filter(d => d.date.substring(0,7) === thisMonth.month);

  const sum = (arr, k) => arr.reduce((s, d) => s + (k === 'cost' ? recordCost(d) : d[k]), 0);
  const lastTk = sum(lastMtd, 'total_tokens'), thisTk = sum(thisMtd, 'total_tokens');
  const lastCst = sum(lastMtd, 'cost'), thisCst = sum(thisMtd, 'cost');
  const lastHit = sum(lastMtd, 'prompt_cache_hit'), thisHit = sum(thisMtd, 'prompt_cache_hit');
  const lastMiss = sum(lastMtd, 'prompt_cache_miss'), thisMiss = sum(thisMtd, 'prompt_cache_miss');
  const lastReq = sum(lastMtd, 'request_count'), thisReq = sum(thisMtd, 'request_count');

  const tkChg = lastTk > 0 ? (thisTk - lastTk) / lastTk * 100 : 0;
  const cstChg = lastCst > 0 ? (thisCst - lastCst) / lastCst * 100 : 0;
  const lastRate = (lastHit+lastMiss) > 0 ? lastHit/(lastHit+lastMiss) : 0;
  const thisRate = (thisHit+thisMiss) > 0 ? thisHit/(thisHit+thisMiss) : 0;
  const hitChg = (thisRate - lastRate) * 100;
  const reqChg = lastReq > 0 ? (thisReq - lastReq) / lastReq * 100 : 0;

  const arrow = v => v > 1 ? '↑' : v < -1 ? '↓' : '→';
  const cls = v => v > 1 ? 'trend-up' : v < -1 ? 'trend-down' : 'trend-flat';
  const note = '(' + (lastMtd[0]?.date||'') + '~' + (lastMtd[lastMtd.length-1]?.date||'') + ' vs ' + (thisMtd[0]?.date||'') + '~' + (thisMtd[thisMtd.length-1]?.date||'') + ')';

  document.getElementById('momCards').innerHTML =
    '<div class="card"><div class="stat-label">Token 對比 (MTD)</div><div class="text-xs text-[var(--text-sub)]">'+note+'</div><div class="stat-value" style="font-size:1.1rem">'+fmtUnit(thisTk)+' <span class="'+cls(tkChg)+'" style="font-size:0.85rem">'+arrow(tkChg)+' '+Math.abs(tkChg).toFixed(1)+'%</span></div></div>' +
    '<div class="card"><div class="stat-label">花費對比 (MTD)</div><div class="text-xs text-[var(--text-sub)]">'+note+'</div><div class="stat-value" style="font-size:1.1rem">'+fmtCny(thisCst)+' <span class="'+cls(cstChg)+'" style="font-size:0.85rem">'+arrow(cstChg)+' '+Math.abs(cstChg).toFixed(1)+'%</span></div></div>' +
    '<div class="card"><div class="stat-label">命中率對比</div><div class="text-xs text-[var(--text-sub)]">'+note+'</div><div class="stat-value" style="font-size:1.1rem;color:'+(hitChg>1?'var(--success)':hitChg<-1?'var(--danger)':'var(--text)')+'">'+fmtPct(thisRate)+' <span style="font-size:0.85rem;color:'+(hitChg>1?'var(--success)':hitChg<-1?'var(--danger)':'var(--text-muted)')+'">'+arrow(hitChg)+' '+Math.abs(hitChg).toFixed(1)+'pp</span></div></div>' +
    '<div class="card"><div class="stat-label">請求數對比</div><div class="text-xs text-[var(--text-sub)]">'+note+'</div><div class="stat-value" style="font-size:1.1rem">'+fmtInt(thisReq)+' <span class="'+cls(reqChg)+'" style="font-size:0.85rem">'+arrow(reqChg)+' '+Math.abs(reqChg).toFixed(1)+'%</span></div></div>';
}

function renderTrendChart(series, g) {
  if (charts.chartMonthly) charts.chartMonthly.destroy();
  const isDark = document.documentElement.classList.contains('dark');
  const key = g === 'month' ? 'month' : g === 'week' ? 'week' : 'date';
  const labels = series.map(s => s[key]);
  const tokens = series.map(s => s.tokens);
  const changes = series.map((s, i) => i === 0 ? null : tokens[i-1] > 0 ? ((tokens[i] - tokens[i-1]) / tokens[i-1] * 100) : 0);
  charts.chartMonthly = new Chart(document.getElementById('chartMonthly'), {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'Token 數', data: tokens, backgroundColor: isDark ? 'rgba(59,130,246,0.5)' : 'rgba(59,130,246,0.3)', borderColor: '#3b82f6', borderWidth: 1, borderRadius: 4, yAxisID: 'y' },
      { label: '增減率 %', data: changes, type: 'line', borderColor: '#f59e0b', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#f59e0b', yAxisID: 'y1', tension: 0.3 },
    ]},
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: isDark ? '#94a3b8' : '#64748b', boxWidth: 12, padding: 16 } }, tooltip: { callbacks: { label: ctx => ctx.dataset.label.includes('%') ? ctx.dataset.label + ': ' + (ctx.raw != null ? ctx.raw.toFixed(1)+'%' : '—') : ctx.dataset.label + ': ' + fmtUnit(ctx.raw) } } },
      scales: {

function renderInsights(summary, daily, modelAgg) {
  const insights = [];
  if (summary.cacheRate < 0.8) insights.push({ level: 'bad', text: 'Cache 命中率僅 ' + fmtPct(summary.cacheRate) + '，低於 80%。建議優化 system prompt 提高命中。' });
  else if (summary.cacheRate < 0.9) insights.push({ level: 'warn', text: 'Cache 命中率 ' + fmtPct(summary.cacheRate) + '，接近理想但仍可改善。' });
  else insights.push({ level: 'good', text: 'Cache 命中率 ' + fmtPct(summary.cacheRate) + '，表現優異！' });
  if (summary.avgTokensPerReq > 10000) insights.push({ level: 'warn', text: '平均每次請求 ' + fmtInt(summary.avgTokensPerReq) + ' tokens，偏高。檢查 conversation history 或 system prompt 是否過大。' });
  if (daily.length >= 14) {
    const recent14 = daily.slice(-14);
    const avg = recent14.reduce((s, d) => s + d.tokens, 0) / recent14.length;
    const spikes = recent14.filter(d => d.tokens > avg * 2);
    if (spikes.length > 0) insights.push({ level: 'bad', text: '偵測到 ' + spikes.length + ' 天用量暴增（>2x 平均）：' + spikes.map(d => d.date).join(', ') + '。' });
  }
  document.getElementById('insightsContainer').innerHTML = insights.map(i => '<div class="insight-' + i.level + ' bg-[var(--bg-card)] rounded-lg p-3 flex items-start gap-2"><span class="text-sm">' + (i.level === 'good' ? '✅' : i.level === 'warn' ? '⚠️' : '🔴') + '</span><span class="text-sm text-[var(--text)]">' + i.text + '</span></div>').join('');
}

function renderModelTable(modelAgg) {
  const sorted = [...modelAgg].sort((a, b) => b.tokens - a.tokens);
  document.querySelector('#modelTable tbody').innerHTML = sorted.map(m => {
    const total = m.hit + m.miss + m.resp;
    const cacheRate = (m.hit + m.miss) > 0 ? m.hit / (m.hit + m.miss) : 0;
    const costStr = m.cost > 0 ? fmtCny(m.cost) : '—';
    return '<tr class="border-t border-[var(--border)]"><td class="py-2"><span style="color:' + (SOURCE_COLOR[m.source] || '#fff') + '">●</span> ' + (SOURCE_LABEL[m.source] || m.source) + '</td><td class="py-2 font-medium">' + m.name + '</td><td class="py-2 text-right">' + fmtUnit(m.hit) + '</td><td class="py-2 text-right">' + fmtUnit(m.miss) + '</td><td class="py-2 text-right">' + fmtUnit(m.resp) + '</td><td class="py-2 text-right font-semibold">' + fmtUnit(total) + '</td><td class="py-2 text-right">' + fmtInt(m.reqs) + '</td><td class="py-2 text-right" style="color:var(--danger)">' + costStr + '</td><td class="py-2 text-right">' + fmtPct(cacheRate) + '</td></tr>';
  }).join('');
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  renderAll();
}
function switchSource(src) {
  currentSource = src;
  document.querySelectorAll('.src-btn').forEach(b => b.classList.toggle('active', b.dataset.src === src));
  renderAll();
}
